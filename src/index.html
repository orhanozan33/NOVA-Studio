<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"><title>NOVA</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<div class="wallpaper"></div><div class="topbar">
  <div class="brand"><span class="brandmark">N</span><span><b>NOVA</b><small>TECH</small></span></div>
  <div class="top-center"><span class="live-dot"></span><span id="system-label">NOVA AI DESKTOP</span></div>
  <div class="top-right"><span id="clock">--:--</span><span id="date"></span><button class="top-icon" data-action="notifications" title="Bildirimler">♧</button><button class="top-icon" data-action="settings" title="Ayarlar">⚙</button><button class="window-btn" data-window="minimize">—</button><button class="window-btn" data-window="maximize">□</button><button class="window-btn close" data-window="fullscreen">×</button></div>
</div>
<div class="desktop">
  <aside class="sidebar">
    <div class="profile"><div class="profile-orb">N</div><div><b id="welcome-name">Merhaba</b><small>NOVA kişisel alanı</small></div><button class="tiny" data-action="profile">✎</button></div>
    <div class="side-caption">ÇALIŞMA ALANI</div>
    <button class="side-link active" data-view="home"><span>⌂</span>Ana Ekran</button>
    <button class="side-link" data-view="agent"><span>✧</span>NOVA Agent</button>
    <button class="side-link" data-view="apps"><span>▦</span>Uygulamalar</button>
    <button class="side-link" data-view="models"><span>⬡</span>Model Merkezi</button>
    <button class="side-link" data-view="automation"><span>⌘</span>Otomasyon & Ajanlar</button>
    <button class="side-link" data-view="files"><span>▱</span>Dosyalar</button>
    <button class="side-link" data-view="security"><span>⬡</span>Güvenlik Merkezi</button>
    <button class="side-link" data-view="settings"><span>⚙</span>Ayarlar</button>
    <div class="sidebar-bottom"><div class="connection"><i></i><span id="connection-label">Yerel AI bağlantısı kontrol ediliyor</span></div><div class="build">NOVA DESKTOP · 0.2.0</div></div>
  </aside>
  <main class="workspace" id="workspace"></main>
  <aside class="agent-panel" id="agent-panel">
    <div class="agent-head"><div class="agent-avatar"><span>N</span></div><div class="agent-title"><b>NOVA Agent</b><small><i></i><span id="agent-status">Bağlantı kontrol ediliyor</span></small></div><div class="agent-head-actions"><button data-action="pin" title="Paneli sabitle">⌖</button><button data-action="agent-expand" title="Genişlet">⛶</button></div></div>
    <div class="agent-visual"><div class="rings"><div class="agent-symbol">N</div></div><div class="visual-caption">YOUR INTELLIGENCE PARTNER</div></div>
    <div class="chat-messages" id="chat-messages"><div class="message assistant"><span class="wave">✦</span><div><b>Merhaba!</b><p>Ben NOVA. Bugün senin için ne yapabilirim?</p><small>NOVA AI</small></div></div></div>
    <div class="quick-actions"><button data-prompt="İnternette araştırma yapmak istiyorum. Nasıl yardımcı olabilirsin?">⌕ Araştırma yap</button><button data-prompt="Bir görev planlamama yardım et.">▷ Bir görev planla</button></div>
    <form class="composer" id="chat-form"><button type="button" class="attach" data-action="attach" title="Dosya ekle">＋</button><textarea id="chat-input" rows="1" placeholder="NOVA ile konuş veya yaz..."></textarea><button type="button" class="voice" data-action="voice" title="Sesli giriş">⌁</button><button class="send" type="submit" title="Gönder">↑</button></form>
    <div class="agent-foot"><span id="model-label">Yerel model bekleniyor</span><button data-view="models">Model seç</button></div>
  </aside>
</div>
<nav class="dock" aria-label="NOVA uygulama dock'u">
  <button data-view="apps"><span>▦</span><small>Uygulamalar</small></button><button data-view="settings"><span>⚙</span><small>Ayarlar</small></button><button data-view="models"><span>ϟ</span><small>Modeller</small></button><button data-view="automation"><span>♧</span><small>Ajanlar</small></button><button data-view="files"><span>▱</span><small>Dosyalar</small></button><button data-view="security"><span>⬡</span><small>Güvenlik</small></button><button data-action="agent-expand"><span>✧</span><small>NOVA Agent</small></button>
</nav>
<div class="toast" id="toast"></div><div class="modal-backdrop hidden" id="modal"><div class="modal" id="modal-content"></div></div>
<script src="./renderer.js"></script></body></html>
